name: Probar y publicar MedOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Calcular basePath
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then BP=""; else BP="/$REPO"; fi
          echo "NEXT_PUBLIC_BASE_PATH=$BP" >> "$GITHUB_ENV"

      - name: Instalar dependencias
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Verificar tipos
        run: npm run typecheck

      - name: Pruebas unitarias
        run: npm test

      - name: Compilar sitio estático
        run: npm run build

      - name: Instalar navegadores (WebKit = Safari)
        run: npx playwright install --with-deps webkit chromium

      - name: Pruebas de punta a punta (informativas, no bloquean la publicación)
        continue-on-error: true
        run: npm run e2e

      - name: Preparar artefacto de Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
